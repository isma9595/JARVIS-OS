name: JARVIS-OS CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up the supported Python environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.6'
          pip-version: '26.1.2'
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt

      - name: Report interpreter and installer versions
        run: |
          python --version
          python -m pip --version

      - name: Install the pinned test environment
        run: python -m pip install --requirement requirements-ci.txt

      - name: Run the supported test suite
        run: python -m pytest -q
